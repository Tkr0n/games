name: verkkugames

services:
  redis:
    image: redis:7-alpine
    container_name: verkku-games-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:-verkkugames_dev_redis}
    ports:
      # Bound to loopback only for local development. In Raspberry Pi production, omit host ports and use the Docker internal network.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-verkkugames_dev_redis}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - verkku-internal

  postgres:
    image: postgres:16-alpine
    container_name: verkku-games-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verkkugames}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verkkugames_dev_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-verkkugames}
    ports:
      # Loopback only for local development. Omit host ports in Raspberry Pi production.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-verkkugames}\" -d \"$${POSTGRES_DB:-verkkugames}\""]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - verkku-internal

  # Optional full-stack Raspberry Pi ARM64 / x64 profile:
  # Run with: docker compose --profile api up -d --build
  api:
    profiles: ["api"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verkku-games-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Cache__RedisConnectionString: "redis:6379,password=${REDIS_PASSWORD:-verkkugames_dev_redis},abortConnect=false"
      # Reserved for v2 transactional store (orders, users, payments). Not consumed by the v1 API yet.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-verkkugames};Username=${POSTGRES_USER:-verkkugames};Password=${POSTGRES_PASSWORD:-verkkugames_dev_postgres}"
      ApiSecurity__ClientApiKey: ${API_CLIENT_KEY:?API_CLIENT_KEY is required}
      Shop2TopUp__KeyId: ${SHOP2TOPUP_KEY_ID:?SHOP2TOPUP_KEY_ID is required}
      Shop2TopUp__KeySecret: ${SHOP2TOPUP_KEY_SECRET:?SHOP2TOPUP_KEY_SECRET is required}
      Shop2TopUp__ProviderUid: ${SHOP2TOPUP_PROVIDER_UID:-d4f8a2c1-7b3e-4f90-9a12-6e8b5c3d1f42}
      FazerCards__BaseUrl: https://api.fzr.cards/api/v2
      FazerCards__ApiKey: ${FAZERCARDS_API_KEY:?FAZERCARDS_API_KEY is required}
      FazerCards__ProviderUid: ${FAZERCARDS_PROVIDER_UID:-9075f324-4177-45e9-a79c-f23722258b8f}
      Pricing__DefaultMarkupPercent: ${PRICING_DEFAULT_MARKUP_PERCENT:-10.0}
      Pricing__MinimumMarginUsd: ${PRICING_MINIMUM_MARGIN_USD:-0.25}
    ports:
      # Bind only to loopback so Cloudflare Tunnel (cloudflared) reaches it locally without LAN/WAN exposure.
      - "127.0.0.1:8080:8080"
    networks:
      - verkku-internal

volumes:
  postgres-data:

networks:
  verkku-internal:
    driver: bridge
